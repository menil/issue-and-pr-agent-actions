# Copy this file to .github/workflows/implement-issue.yml in your repository and edit the
# places marked EDIT. Read "Issue implementation" in the README first: it needs a repository
# setting turned on, uses your Claude subscription, and has risks to understand.
#
# What it does: for an issue by someone with write access (when AGENT_AUTO is on), or an
# issue a maintainer labels ready-to-implement, a model assesses whether it is real and
# reproducible; if so, another run writes a fix and opens a pull request, ready for review.
# A person reviews and merges it. The model never merges, approves or labels.
#
# All the jobs, the guard that decides who may start a run and what each job may touch live
# in menil/issue-and-pr-agent-actions/.github/workflows/implement.yml, so this file does not change
# when they do: only the version in the `uses:` line below does.
name: Implement issue

on:
  issues:
    types: [opened, labeled]

# Nothing by default; the one job below asks for what the jobs it calls need between them.
permissions: {}

# One run per issue, queued and never cancelled halfway.
concurrency:
  group: implement-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    # The most the called jobs need between them. Each of them asks for less, and none asks
    # for `workflows`.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # `@v1` follows the latest 1.x release of menil/issue-and-pr-agent-actions. For a fixed version,
    # pin the full commit of a release instead, with the release in a comment; Dependabot can then
    # bump it.
    uses: menil/issue-and-pr-agent-actions/.github/workflows/implement.yml@v1
    with:
      # The repository variables AGENT_AUTO ('true' lets your own new issues start a run) and
      # AGENT_DAILY_CAP (assessments per 24 hours; 5 if empty, 0 pauses everything).
      agent_auto: ${{ vars.AGENT_AUTO }}
      daily_cap: ${{ vars.AGENT_DAILY_CAP }}
      # EDIT: the commands the model may run to reproduce a problem. Nothing else is allowed
      # apart from reading files. One command per pattern, comma-separated.
      assess_command_tools: 'Bash(cargo test:*)'
      # EDIT: the same, plus whatever builds and checks, so a change can be made to pass.
      fix_command_tools: 'Bash(cargo test:*),Bash(cargo build:*)'
      # EDIT: what a newcomer needs to know about this repository.
      repository_notes: |
        Run the tests with `cargo test`.
      # Optional, with their defaults:
      #   fix_repository_notes: notes for the fix stage only (repository_notes if empty)
      #   fix_max_turns: '40'
      #   draft: false
      #   install_nix: false   # true if the tests need a Nix shell
      #   setup_command: ''     # a command to install the tools the commands above need
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Optional: lets the review fall back to OpenRouter if Claude fails.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
