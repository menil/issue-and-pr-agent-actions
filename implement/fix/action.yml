name: 'AI Issue Implementation: fix'
description: 'Lets the model edit files to fix an assessed issue, then refuses any change that must not be committed, commits, pushes agent/issue-N-<words> and opens a pull request. Third stage of the implementation action (docs/implement-action.md).'
author: 'meni'
branding:
  icon: 'git-pull-request'
  color: 'blue'

# The calling job must check the repository out first (with persist-credentials: false),
# and needs contents: write, pull-requests: write and issues: read, never workflows.
inputs:
  claude_code_oauth_token:
    description: 'Claude Code OAuth token. It reaches only the model step.'
    required: true
  github_token:
    description: 'GITHUB_TOKEN to read the issue, push the branch and open the pull request'
    required: false
    default: '${{ github.token }}'
  issue_number:
    description: 'Number of the issue to fix'
    required: true
  actor_login:
    description: 'Who applied the ready-to-implement label, when that is what started the run (see the assess action).'
    required: false
    default: ''
  repository_notes:
    description: "The repository's own notes for the model: which command runs the tests, and anything a newcomer should know. Appended to the prompt."
    required: false
    default: ''
  command_tools:
    description: 'The commands the model may run, as Claude Code tool patterns, comma-separated, for example Bash(cargo test:*). Read, Grep, Glob, Edit and Write are always allowed; nothing else is.'
    required: true
  max_turns:
    description: 'Most back-and-forth exchanges the model may take'
    required: false
    default: '20'
  draft:
    description: "Open the pull request as a draft: 'true' or 'false'. The default is a pull request that is ready for review, because a person reviews it either way and a draft would be reviewed again when it is marked ready."
    required: false
    default: 'false'
  base_branch:
    description: 'The branch the pull request is opened against'
    required: false
    default: '${{ github.event.repository.default_branch }}'

outputs:
  pull_request_url:
    description: 'The pull request that was opened; empty when nothing was changed'
    value: ${{ steps.open.outputs.pull_request_url }}
  outcome:
    description: "'opened' when a pull request was opened, 'no_change' when the model changed nothing (it could not show the problem with a failing test). A change that must not be committed is an error, not an outcome."
    value: ${{ steps.open.outputs.outcome }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Check the inputs that end up inside quotes
      shell: bash
      env:
        MAX_TURNS: ${{ inputs.max_turns }}
        COMMAND_TOOLS: ${{ inputs.command_tools }}
        IMPLEMENT: ${{ github.action_path }}/../../src/implement.py
      run: |
        set -euo pipefail
        [[ "$MAX_TURNS" =~ ^[0-9]+$ ]] || { echo "::error::max_turns must be a number."; exit 1; }
        # Refuses a list that would hand the model a shell, the network or the environment.
        python "$IMPLEMENT" check-tools

    - name: Read the issue, only if a trusted person stands behind it
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        ACTOR_LOGIN: ${{ inputs.actor_login }}
      run: python ${{ github.action_path }}/../../src/implement.py fetch

    - name: Build the prompt
      id: prompt
      shell: bash
      env:
        REPO_NOTES: ${{ inputs.repository_notes }}
      run: python ${{ github.action_path }}/../../src/implement.py prompt fix

    - name: Fix the issue
      id: model
      uses: anthropics/claude-code-action@8d70a0dd265122bd65b8e09d3d959e65373ae2a1 # v1.0.260
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        github_token: ${{ inputs.github_token }}
        prompt: ${{ steps.prompt.outputs.prompt }}
        claude_args: |
          --max-turns ${{ inputs.max_turns }}
          --permission-mode acceptEdits
          --allowedTools "Read,Grep,Glob,Edit,Write,${{ inputs.command_tools }}"
          --disallowedTools "WebFetch,WebSearch,Bash(git:*)"

    - name: Report how long the run took
      if: always() && steps.model.outcome != 'skipped'
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.model.outputs.execution_file }}
      run: |
        # Numbers only, never what the model said: it is steered by the issue.
        jq -sc '[.[] | if type=="array" then .[] else . end] | map(select(.type? == "result")) | last | {subtype, is_error, num_turns, duration_ms, total_cost_usd}' "$EXECUTION_FILE" \
          || echo "Could not read the execution file."

    - name: Commit, push and open a pull request
      id: open
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        NUMBER: ${{ inputs.issue_number }}
        BASE_BRANCH: ${{ inputs.base_branch }}
        DRAFT: ${{ inputs.draft }}
        REPO: ${{ github.repository }}
        IMPLEMENT: ${{ github.action_path }}/../../src/implement.py
      run: |
        set -euo pipefail
        [[ "$NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Not an issue number."; exit 1; }
        [[ "$BASE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::Not a branch name."; exit 1; }
        [[ "$DRAFT" == "true" || "$DRAFT" == "false" ]] || { echo "::error::draft must be true or false."; exit 1; }

        # Code, not the model, decides what may be committed. Renames are listed as a
        # delete and an add, and files the model created are included.
        changes="$(mktemp)"
        { git diff --name-only --no-renames -z HEAD; git ls-files --others --exclude-standard -z; } > "$changes"

        # The model is told to change nothing when it cannot show the problem with a failing
        # test. That is the instruction followed, not an error: say so and stop, before
        # anything is checked, named, committed or pushed.
        if [ ! -s "$changes" ]; then
          echo "The model made no changes; nothing was committed or opened."
          echo "outcome=no_change" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        python "$IMPLEMENT" check-changes < "$changes"

        # The model's own words for the commit and the pull request, read under a fixed
        # contract and made safe; the generic text if its file is missing or wrong.
        texts="$(mktemp -d)"
        python "$IMPLEMENT" describe "$texts" "$NUMBER"

        # The name is `agent/issue-N`, then words from the change's title. It is checked
        # again here, because it ends up in a git command: it must be this issue's, and only
        # lowercase letters, digits and single hyphens may follow the number.
        branch="$(cat "$texts/branch.txt")"
        [[ "$branch" =~ ^agent/issue-[0-9]+(-[a-z0-9]+)*$ ]] || { echo "::error::Not a branch name."; exit 1; }
        [[ "$branch" == "agent/issue-${NUMBER}" || "$branch" == "agent/issue-${NUMBER}-"* ]] || { echo "::error::The branch is not this issue's."; exit 1; }
        remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

        # Never add to a branch that is already there: a push to one would fast-forward it.
        # The words in the name can differ from one run to the next, so an earlier attempt
        # under any name for this issue counts, or a retry would open a second pull request.
        status=0
        git ls-remote --exit-code --heads "$remote" "refs/heads/agent/issue-${NUMBER}" "refs/heads/agent/issue-${NUMBER}-*" > /dev/null 2>&1 || status=$?
        case "$status" in
          2) ;;
          0) echo "::error::A branch for this issue already exists (agent/issue-${NUMBER} or agent/issue-${NUMBER}-...); nothing was pushed."; exit 1 ;;
          *) echo "::error::Could not look for the branch $branch; nothing was pushed."; exit 1 ;;
        esac

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b "$branch"
        git add -A
        git commit -q -F "$texts/commit.txt"
        git push "$remote" "$branch"
        failure="$(mktemp)"
        # A draft only when asked for; the empty list is written so that it is safe under
        # `set -u` in the older bash that some runners have.
        draft_flag=()
        if [[ "$DRAFT" == "true" ]]; then draft_flag=(--draft); fi
        if ! url=$(gh pr create ${draft_flag[@]+"${draft_flag[@]}"} --base "$BASE_BRANCH" --head "$branch" \
          --title "$(cat "$texts/title.txt")" --body-file "$texts/body.md" 2> "$failure"); then
          sed 's/^/gh: /' "$failure"
          echo "::error::The branch $branch was pushed but the pull request could not be opened. If GitHub says Actions may not create pull requests, turn on 'Allow GitHub Actions to create and approve pull requests' under Settings, Actions, General. Then delete the branch and run again."
          exit 1
        fi
        echo "pull_request_url=$url" >> "$GITHUB_OUTPUT"
        echo "outcome=opened" >> "$GITHUB_OUTPUT"
