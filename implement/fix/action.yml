name: 'AI Issue Implementation: fix'
description: 'Lets the model edit files to fix an assessed issue, then refuses any change that must not be committed, commits, pushes agent/issue-N and opens a draft pull request. Third stage of the implementation action (docs/implement-action.md).'
author: 'meni'
branding:
  icon: 'git-pull-request'
  color: 'blue'

# The calling job must check the repository out first (with persist-credentials: false),
# and needs contents: write, pull-requests: write and issues: read, never workflows.
inputs:
  claude_code_oauth_token:
    description: 'Claude Code OAuth token. It reaches only the model step.'
    required: true
  github_token:
    description: 'GITHUB_TOKEN to read the issue, push the branch and open the pull request'
    required: false
    default: '${{ github.token }}'
  issue_number:
    description: 'Number of the issue to fix'
    required: true
  actor_login:
    description: 'Who applied the ready-to-implement label, when that is what started the run (see the assess action).'
    required: false
    default: ''
  repository_notes:
    description: "The repository's own notes for the model: which command runs the tests, and anything a newcomer should know. Appended to the prompt."
    required: false
    default: ''
  command_tools:
    description: 'The commands the model may run, as Claude Code tool patterns, comma-separated, for example Bash(cargo test:*). Read, Grep, Glob, Edit and Write are always allowed; nothing else is.'
    required: true
  max_turns:
    description: 'Most back-and-forth exchanges the model may take'
    required: false
    default: '20'
  base_branch:
    description: 'The branch the pull request is opened against'
    required: false
    default: '${{ github.event.repository.default_branch }}'

outputs:
  pull_request_url:
    description: 'The draft pull request that was opened'
    value: ${{ steps.open.outputs.pull_request_url }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Check the inputs that end up inside quotes
      shell: bash
      env:
        MAX_TURNS: ${{ inputs.max_turns }}
        COMMAND_TOOLS: ${{ inputs.command_tools }}
      run: |
        set -euo pipefail
        [[ "$MAX_TURNS" =~ ^[0-9]+$ ]] || { echo "::error::max_turns must be a number."; exit 1; }
        case "$COMMAND_TOOLS" in
          '') echo "::error::command_tools must name at least one command."; exit 1 ;;
          *'"'*|*$'\n'*) echo "::error::command_tools must not contain a double quote or a newline."; exit 1 ;;
        esac

    - name: Read the issue, only if a trusted person stands behind it
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        ACTOR_LOGIN: ${{ inputs.actor_login }}
      run: python ${{ github.action_path }}/../../src/implement.py fetch

    - name: Build the prompt
      id: prompt
      shell: bash
      env:
        REPO_NOTES: ${{ inputs.repository_notes }}
      run: python ${{ github.action_path }}/../../src/implement.py prompt fix

    - name: Fix the issue
      id: model
      uses: anthropics/claude-code-action@8d70a0dd265122bd65b8e09d3d959e65373ae2a1 # v1.0.260
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        github_token: ${{ inputs.github_token }}
        prompt: ${{ steps.prompt.outputs.prompt }}
        claude_args: |
          --max-turns ${{ inputs.max_turns }}
          --permission-mode acceptEdits
          --allowedTools "Read,Grep,Glob,Edit,Write,${{ inputs.command_tools }}"
          --disallowedTools "WebFetch,WebSearch,Bash(git:*)"

    - name: Report how long the run took
      if: always()
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.model.outputs.execution_file }}
      run: |
        # Numbers only, never what the model said: it is steered by the issue.
        jq -sc '[.[] | if type=="array" then .[] else . end] | map(select(.type? == "result")) | last | {subtype, is_error, num_turns, duration_ms, total_cost_usd}' "$EXECUTION_FILE" \
          || echo "Could not read the execution file."

    - name: Commit, push and open a draft pull request
      id: open
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        NUMBER: ${{ inputs.issue_number }}
        BASE_BRANCH: ${{ inputs.base_branch }}
        REPO: ${{ github.repository }}
        IMPLEMENT: ${{ github.action_path }}/../../src/implement.py
      run: |
        set -euo pipefail
        [[ "$NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Not an issue number."; exit 1; }
        [[ "$BASE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::Not a branch name."; exit 1; }

        # Code, not the model, decides what may be committed. Renames are listed as a
        # delete and an add, and files the model created are included.
        { git diff --name-only --no-renames -z HEAD; git ls-files --others --exclude-standard -z; } \
          | python "$IMPLEMENT" check-changes

        branch="agent/issue-${NUMBER}"
        remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

        # Never add to a branch that is already there: a push to one would fast-forward it.
        status=0
        git ls-remote --exit-code --heads "$remote" "$branch" > /dev/null 2>&1 || status=$?
        case "$status" in
          2) ;;
          0) echo "::error::The branch $branch already exists; nothing was pushed."; exit 1 ;;
          *) echo "::error::Could not look for the branch $branch; nothing was pushed."; exit 1 ;;
        esac

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b "$branch"
        git add -A
        git commit -q -m "fix: address issue #${NUMBER}"
        git push "$remote" "$branch"
        failure="$(mktemp)"
        if ! url=$(gh pr create --draft --base "$BASE_BRANCH" --head "$branch" \
          --title "fix: address issue #${NUMBER}" \
          --body "Opened automatically from #${NUMBER}, as a draft. A model wrote this change; nothing here has been reviewed, merged or approved by it. Read the change and its regression test before anything else.

        Closes #${NUMBER}" 2> "$failure"); then
          sed 's/^/gh: /' "$failure"
          echo "::error::The branch $branch was pushed but the pull request could not be opened. If GitHub says Actions may not create pull requests, turn on 'Allow GitHub Actions to create and approve pull requests' under Settings, Actions, General. Then delete the branch and run again."
          exit 1
        fi
        echo "pull_request_url=$url" >> "$GITHUB_OUTPUT"
