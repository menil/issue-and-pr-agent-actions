name: 'AI Issue Implementation: finish'
description: 'Tidies the issue when the fix stage is done. If a pull request was opened: takes off ready-to-implement, puts on pr-open and leaves one comment with the link, once per pull request. If the agent changed nothing: takes off ready-to-implement, puts on needs-human and leaves one comment saying so, once. No model runs here, and the labels and text are fixed. Part of the implementation action (docs/implement-action.md).'
author: 'meni'
branding:
  icon: 'check-circle'
  color: 'purple'

# Needs no checkout. Give the job issues: write and nothing else.
inputs:
  github_token:
    description: 'GITHUB_TOKEN to change the labels and write the comment (issues: write)'
    required: false
    default: '${{ github.token }}'
  issue_number:
    description: 'Number of the issue the pull request was opened for'
    required: true
  outcome:
    description: "What the fix stage did, as the fix action outputs it: 'opened' (a pull request was opened) or 'no_change' (it changed nothing). Anything else is refused."
    required: false
    default: 'opened'
  reason:
    description: "When the outcome is 'no_change': the model's own reason, as the fix action outputs it. It is made safe here, once, and quoted in the comment as unchecked."
    required: false
    default: ''
  denied:
    description: "When the outcome is 'no_change': the commands the model was refused, as the fix action outputs them (a JSON array of strings). Shown as inline code."
    required: false
    default: ''
  pull_request_url:
    description: "The URL of the pull request, as the fix action outputs it. Needed when the outcome is 'opened', and then only the exact form of a pull request of this repository is accepted; not used when nothing changed."
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Tidy the issue
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        OUTCOME: ${{ inputs.outcome }}
        REASON: ${{ inputs.reason }}
        DENIED: ${{ inputs.denied }}
        PULL_REQUEST_URL: ${{ inputs.pull_request_url }}
      run: python ${{ github.action_path }}/../../src/implement.py finish
