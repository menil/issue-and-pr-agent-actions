version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    # The composite actions' own files, which pin the third-party actions they use (the
    # Claude action). Every directory holding an action.yml is listed; a test checks that.
    directories:
      - "/"
      - "/review"
      - "/triage"
      - "/implement/assess"
      - "/implement/report"
      - "/implement/fix"
      - "/implement/notify"
      - "/implement/finish"
    # The shared workflow names this repository's own actions by the release it ships in, and
    # scripts/pin_implement_actions.py changes them; Dependabot must not propose its own.
    ignore:
      - dependency-name: "menil/issue-and-pr-agent-actions"
      - dependency-name: "menil/issue-and-pr-agent-actions/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
